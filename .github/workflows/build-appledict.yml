name: Build Apple Dictionary

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Позволяет запускать сборку вручную из интерфейса GitHub

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. Клонируем ваш репозиторий с исходниками словаря
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Скачиваем утилиты Apple Dictionary Development Kit (DDK)
      - name: Clone Dictionary Development Kit
        run: |
          git clone https://github.com/SebastianSzturo/Dictionary-Development-Kit.git ddk

      # 3. Запускаем компиляцию словаря
      - name: Build Dictionary
        run: |
          # Указываем путь к инструментам Apple DDK
          export DICT_BUILD_TOOL_DIR="$(pwd)/ddk"
          
          # Переходим в папку с файлами, сгенерированными PyGlossary
          # (Если файлы лежат в корне репозитория, указывать cd не нужно)
          cd path/to/your/appledict_folder
          
          # Запускаем сборку через Makefile
          make

      # 4. Упаковываем скомпилированный словарь в ZIP-архив
      - name: Compress Dictionary
        run: |
          # В результате компиляции создается папка objects/*.dictionary
          cd path/to/your/appledict_folder/objects
          zip -r ../../../ApresyanEnRu.dictionary.zip *.dictionary

      # 5. Загружаем готовый ZIP-файл в артефакты сборки
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApresyanEnRu-AppleDict
          path: ApresyanEnRu.dictionary.zip
