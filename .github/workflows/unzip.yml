name: Unpack ZIP File

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  unzip-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ZIP archive
        run: |
          mkdir -p dict_src
          unzip -o ApresyanEnRu.dictionary.zip -d dict_src

      - name: Upload Unzipped Content
        uses: actions/upload-artifact@v4
        with:
          name: Unzipped-Files
          path: dict_src/
