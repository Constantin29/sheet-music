name: Build Apple Dictionary

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. Клонируем репозиторий с вашим ZIP-архивом
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Скачиваем Apple DDK и привязываем его к системному пути macOS
      - name: Setup Dictionary Development Kit
        run: |
          git clone https://github.com/SebastianSzturo/Dictionary-Development-Kit.git ddk
          sudo mkdir -p "/Applications/Utilities"
          sudo ln -s "$(pwd)/ddk" "/Applications/Utilities/Dictionary Development Kit"

      # 3. Распаковываем исходники словаря
      - name: Unpack Dictionary Source
        run: |
          mkdir -p dict_src
          unzip -o ApresyanEnRu.dictionary.zip -d dict_src

      # 4. Находим Makefile и запускаем сборку
      - name: Build Dictionary
        run: |
          MAKEFILE_PATH=$(find dict_src -name "Makefile" | head -n 1)
          MAKEFILE_DIR=$(dirname "$MAKEFILE_PATH")
          
          echo "Переходим в папку: $MAKEFILE_DIR"
          cd "$MAKEFILE_DIR"
          make

      # 5. Запаковываем скомпилированный словарь в ZIP
      - name: Compress Dictionary
        run: |
          DICT_PATH=$(find dict_src -name "*.dictionary" -type d | head -n 1)
          DICT_DIR=$(dirname "$DICT_PATH")
          DICT_NAME=$(basename "$DICT_PATH")
          
          cd "$DICT_DIR"
          zip -r "$GITHUB_WORKSPACE/ApresyanEnRu-Compiled.dictionary.zip" "$DICT_NAME"

      # 6. Загружаем итоговый файл в скачиваемые артефакты
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApresyanEnRu-AppleDict
          path: ApresyanEnRu-Compiled.dictionary.zip
